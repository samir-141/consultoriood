<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="100%" height="100%" role="img" aria-label="Ilustración editorial del equipo profesional de demostración: Odontóloga A y Odontólogo B">
  <defs>
    <linearGradient id="eq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBF4E6"/>
      <stop offset="100%" stop-color="#F3ECE1"/>
    </linearGradient>
    <filter id="eq-shadow" x="-8%" y="-8%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#173F37" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="480" height="320" rx="20" fill="url(#eq-bg)"/>
  <rect x="14" y="14" width="452" height="292" rx="16" fill="none" stroke="#DDEEE4" stroke-width="1.5"/>
  <circle cx="240" cy="160" r="115" fill="#DDEEE4" fill-opacity="0.38"/>

  <!-- Perfil A: Odontóloga A (Estilizado editorial) -->
  <g id="perfil-odontologa" filter="url(#eq-shadow)">
    <!-- Marco contenedor de tarjeta de demostración -->
    <rect x="64" y="64" width="160" height="192" rx="14" fill="#FFFFFF" stroke="#2D7464" stroke-width="2"/>
    <rect x="64" y="64" width="160" height="36" rx="14" fill="#235E50"/>
    <text x="88" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ODONTÓLOGA A</text>

    <!-- Avatar estilizado -->
    <circle cx="144" cy="140" r="30" fill="#EAF1E8" stroke="#235E50" stroke-width="1.5"/>
    <!-- Cabello / silueta -->
    <path d="M 126 138 C 126 122 135 116 144 116 C 153 116 162 122 162 138 C 162 144 156 148 144 148 C 132 148 126 144 126 138 Z" fill="#173F37"/>
    <circle cx="144" cy="136" r="14" fill="#FBF4E6"/>
    <!-- Bata clínica -->
    <path d="M 124 168 C 128 152 140 150 144 150 C 148 150 160 152 164 168 Z" fill="#235E50"/>
    <path d="M 144 150 L 144 168" stroke="#FFFFFF" stroke-width="1.5"/>

    <text x="82" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#173F37">Equipo demostración</text>
    <text x="82" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#536B61">Odontología general</text>

    <rect x="80" y="222" width="128" height="20" rx="5" fill="#FBF4E6"/>
    <text x="96" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#235E50">Lun–Sáb disponible</text>
  </g>

  <!-- Perfil B: Odontólogo B (Estilizado editorial) -->
  <g id="perfil-odontologo" filter="url(#eq-shadow)">
    <!-- Marco contenedor de tarjeta de demostración -->
    <rect x="256" y="64" width="160" height="192" rx="14" fill="#FFFFFF" stroke="#2D7464" stroke-width="2"/>
    <rect x="256" y="64" width="160" height="36" rx="14" fill="#173F37"/>
    <text x="280" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">ODONTÓLOGO B</text>

    <!-- Avatar estilizado -->
    <circle cx="336" cy="140" r="30" fill="#EAF1E8" stroke="#173F37" stroke-width="1.5"/>
    <!-- Cabello corto -->
    <path d="M 124 134 C 124 122 134 116 144 116 C 154 116 164 122 164 134 Z" transform="translate(192, 0)" fill="#D59172"/>
    <circle cx="336" cy="136" r="14" fill="#FBF4E6"/>
    <!-- Bata clínica -->
    <path d="M 316 168 C 320 152 332 150 336 150 C 340 150 352 152 356 168 Z" fill="#2D7464"/>
    <path d="M 336 150 L 336 168" stroke="#FFFFFF" stroke-width="1.5"/>

    <text x="274" y="194" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#173F37">Equipo demostración</text>
    <text x="274" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#536B61">Evaluación y seguimiento</text>

    <rect x="272" y="222" width="128" height="20" rx="5" fill="#FBF4E6"/>
    <text x="288" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#235E50">Lun–Sáb disponible</text>
  </g>

  <!-- Acentos decorativos -->
  <path d="M 240 46 Q 240 54 248 54 Q 240 54 240 62 Q 240 54 232 54 Q 240 54 240 46 Z" fill="#D59172"/>
  <circle cx="44" cy="160" r="4.5" fill="#2D7464" fill-opacity="0.4"/>
  <circle cx="436" cy="160" r="4.5" fill="#D59172"/>
</svg>
